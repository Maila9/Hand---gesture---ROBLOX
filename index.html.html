<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Roblox Cart Controller</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#9ec653}
body{font-family:'Fredoka',sans-serif;overflow-x:hidden}
button{font-family:inherit}

.page{
    width:100%;
    min-height:100vh;
    background:#9ec653;
}

.artboard{
    position:relative;
    width:min(86vw, 1080px);
    max-width:1080px;
    margin:24px auto;
    aspect-ratio:1008 / 1536;
    overflow:hidden;
}

.artboard > .background{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
}

.ui{
    position:absolute;
    inset:0;
}

.ble-button{
    position:absolute;
    left:78.0%;
    top:1.65%;
    width:19.5%;
    height:4.1%;
    border:0;
    border-radius:30px;
    background:transparent;
    cursor:pointer;
    color:transparent;
    z-index:30;
    pointer-events:auto;
    touch-action:manipulation;
    pointer-events:auto;
    touch-action:manipulation;
}

.firebase-button{
    position:absolute;
    left:71.9%;
    top:1.35%;
    width:5.1%;
    height:4.8%;
    border:0;
    border-radius:50%;
    background:transparent;
    cursor:pointer;
    z-index:30;
    pointer-events:auto;
    touch-action:manipulation;
}

.dpad{
    position:absolute;
    left:8.8%;
    top:57.0%;
    width:32.6%;
    height:22.0%;
}

.dpad button{
    position:absolute;
    border:0;
    background:rgba(255,255,255,0);
    cursor:pointer;
    border-radius:22px;
    touch-action:none;
}

.dpad button:active{
    background:rgba(255,255,255,.22);
}

.up{left:35%;top:0;width:30%;height:31%}
.left{left:0;top:35%;width:31%;height:30%}
.right{right:0;top:35%;width:31%;height:30%}
.down{left:35%;bottom:0;width:30%;height:31%}

 .camera-area{
    position:absolute;
    left:56.88%;
    top:60.06%;
    width:27.53%;
    height:17.87%;
    overflow:hidden;
    pointer-events:none;
    background:#000 !important;
    border-radius:0;
    border:0;
    line-height:0;
    z-index:12;
}

#camera-video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:none;
    margin:0;
    padding:0;
    border:0;
    background:#000;
    object-fit:cover;
    object-position:center center;
    transform:scaleX(1);
    -webkit-transform:scaleX(1);
    z-index:1;
}

 .gesture-result{
    position:absolute;
    left:6px;
    right:6px;
    bottom:6px;
    padding:7px 9px;
    border-radius:10px;
    background:rgba(0,0,0,.72);
    color:#fff;
    font-family:'Fredoka',sans-serif;
    z-index:5;
    pointer-events:none;
    backdrop-filter:blur(2px);
}
.gesture-title{font-size:9px;font-weight:700;letter-spacing:.8px;opacity:.75}
.gesture-name{font-size:15px;font-weight:700;line-height:1.1;margin-top:1px;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gesture-percent-row{display:flex;align-items:center;gap:6px;margin-top:4px}
#gesture-percent{font-size:11px;font-weight:700;min-width:32px}
.gesture-bar{height:5px;flex:1;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden}
#gesture-bar-fill{display:block;height:100%;width:0;background:#8ff05b;border-radius:99px;transition:width .12s ease}
.gesture-list{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;max-height:28px;overflow:hidden}
.gesture-list span{font-size:8px;padding:2px 5px;border-radius:5px;background:rgba(255,255,255,.12);white-space:nowrap}
 .camera-toggle{
    position:absolute;
    left:62.25%;
    top:79.05%;
    width:15.55%;
    height:4.15%;
    border:4px solid #fff;
    border-radius:22px;
    background:#ef4141;
    color:#fff;
    cursor:pointer;
    font-family:'Fredoka',sans-serif;
    font-size:clamp(16px,2.1vw,30px);
    font-weight:700;
    line-height:1;
    z-index:30;
    pointer-events:auto;
    touch-action:manipulation;
    box-shadow:0 2px 0 rgba(0,0,0,.08);
}
.camera-toggle.on{
    background:#8ff05b;
}
.camera-toggle:active{
    transform:translateY(1px);
}

.status-dot{
    position:absolute;
    left:4%;
    top:91%;
    color:transparent;
    pointer-events:none;
}

.hidden{display:none!important}

.modal{
    position:fixed; inset:0; z-index:100; display:none;
    align-items:center; justify-content:center; padding:18px;
    background:rgba(7,3,17,.72); backdrop-filter:blur(6px);
}
.modal.show{display:flex}
.modal-card{
    position:relative; width:min(672px,100%); padding:34px 36px 36px;
    background:#fff3c4; border:2px solid #f3a53a; border-radius:34px;
    box-shadow:0 24px 70px rgba(70,55,15,.35); color:#4c5d2a;
}
.modal-head{
    display:flex; align-items:center; gap:13px; padding-bottom:20px;
    border-bottom:2px solid #f3b45a; margin-bottom:25px;
}
.modal-icon{font-size:25px;line-height:1}
.modal-card h2{margin:0;color:#e86f24;font-size:clamp(20px,3vw,27px);font-weight:700}
.modal-close{
    position:absolute; top:25px; right:27px; border:0; background:transparent;
    color:#ef8b2d; font-size:31px; line-height:1; cursor:pointer; padding:2px 5px;
}
.modal-close:hover{color:#6e8f38}
.field{margin:0 0 24px}
.field label{display:block;font-size:18px;font-weight:600;color:#60733a;margin-bottom:8px}
.field input{
    width:100%; height:51px; border:2px solid #9bc24b; border-radius:18px;
    padding:0 17px; outline:none; background:#fffdf3; color:#4b552f;
    font-family:inherit; font-size:17px;
}
.field input::placeholder{color:#9b9b86}
.field input:focus{border-color:#f39a35;box-shadow:0 0 0 2px rgba(243,154,53,.16)}
.modal-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:35px}
.modal-actions button{border:0;border-radius:17px;min-height:48px;padding:0 24px;cursor:pointer;font-family:inherit;font-size:16px;font-weight:700}
.cancel{background:#78a83e;color:#fff}
.save{background:linear-gradient(90deg,#f39a35,#ef7426);color:white;min-width:205px}
.save:hover{filter:brightness(1.08)}
@media(max-width:600px){
    .modal-card{padding:27px 22px 25px;border-radius:26px}
    .modal-head{margin-bottom:21px}.field label{font-size:16px}.field input{font-size:15px}
    .modal-actions button{padding:0 17px}
}

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(100px);
    z-index:200;
    background:rgba(54,65,28,.92);
    color:white;
    padding:10px 17px;
    border-radius:999px;
    font-size:13px;
    transition:.25s;
    pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:700px){
    .artboard{
        width:94vw;
        margin:12px auto;
    }
}

.status-bar{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:90;
    min-height:62px;
    padding:7px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    background:rgba(105,151,37,.94);
    color:#fff;
    font-size:14px;
    font-weight:700;
    border-radius:10px 10px 0 0;
    box-shadow:0 -4px 15px rgba(55,75,20,.12);
}
.status-left{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.status-item,.status-command{display:flex;align-items:center;gap:6px;white-space:nowrap}
.status-pill{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:29px;
    padding:3px 10px;
    border-radius:17px;
    background:rgba(75,103,28,.78);
    color:#fff;
    font-size:13px;
    font-weight:700;
}
@media(max-width:700px){
    .status-bar{font-size:10px;min-height:56px;padding:6px 8px}
    .status-left{gap:7px}
    .status-item,.status-command{gap:3px}
    .status-pill{min-height:24px;padding:2px 7px;font-size:10px}
}

body{padding-bottom:62px;}
</style>
</head>

            <!-- Tombol Bluetooth: posisinya mengikuti desain gambar -->

                <button id="bt-up" class="up" aria-label="Maju"></button>

                <video id="camera-video" autoplay muted playsinline></video>

                    <div class="gesture-title">TERDETEKSI</div>

                    <div class="gesture-percent-row"><span id="gesture-percent">0%</span><div class="gesture-bar"><span id="gesture-bar-fill"></span></div></div>
                    <div id="gesture-list" class="gesture-list"></div>
                </div>
            </div>

                    class="camera-toggle"

<footer class="status-bar">
  <div class="status-left">
    <div class="status-item"><span>BLE:</span><strong id="ble-status" class="status-pill">Terputus</strong></div>
    <div class="status-item"><span>Firebase:</span><strong id="fb-status" class="status-pill">Belum Terhubung</strong></div>
    <div class="status-item"><span>Mode:</span><strong id="mode-badge" class="status-pill">Manual</strong></div>
  </div>

    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="fb-title">
        <button class="modal-close" onclick="toggleModal(false)" aria-label="Tutup">×</button>

            <span class="modal-icon">🔥</span>
            <h2 id="fb-title">Konfigurasi Firebase Realtime DB</h2>
        </div>

            <label for="fb-api-key">API Key</label>
            <input id="fb-api-key" autocomplete="off" placeholder="AIzaSy...">
        </div>
        <div class="field">
            <label for="fb-db-url">Database URL</label>
            <input id="fb-db-url" autocomplete="off" placeholder="https://your-app-default-rtdb.firebaseio.com">
        </div>

            <button class="save" onclick="initFirebase()">Simpan &amp; Hubungkan</button>
        </div>

</div>

<script>
/* =========================
   KONFIGURASI
========================= */
const MODEL_URL = "https://teachablemachine.withgoogle.com/models/mZ_Qhc9ZT/";
const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const UART_TX_CHARACTERISTIC_UUID = "6e400002-b5a3-f393-e0a9-e50e24dcca9e"; // write TO micro:bit (RX char)
const UART_RX_CHARACTERISTIC_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e"; // notify FROM micro:bit (TX char)

let bluetoothDevice = null;
let uartTxCharacteristic = null;
let uartRxCharacteristic = null;
let dbRef = null;

let model = null;
let maxPredictions = 0;
let currentCommand = "stop";
let isAiMode = false;
let predictionBusy = false;
let cameraStream = null;
let aiHeartbeatTimer = null;
let manualOverrideCommand = null;
let manualOverrideTimer = null;


function updateStatus(){
    const ble = document.getElementById("ble-status");
    const fb = document.getElementById("fb-status");
    const mode = document.getElementById("mode-badge");
    const last = document.getElementById("last-cmd");

    if(ble) ble.textContent = (uartTxCharacteristic || uartRxCharacteristic) ? "Terhubung" : "Terputus";
    if(fb) fb.textContent = dbRef ? "Terhubung" : "Belum Terhubung";
    if(mode) mode.textContent = isAiMode ? "AI Gesture" : "Manual";
    if(last) last.textContent = String(currentCommand || "stop").toUpperCase();
}

function setCameraButton(on){
    const btn = document.getElementById("camera-toggle");
    if(!btn) return;
    btn.textContent = on ? "ON" : "OFF";
    btn.classList.toggle("on", on);
}

/* =========================
   TOAST
========================= */
function showToast(text){
    const t = document.getElementById("toast");
    t.textContent = text;
    t.classList.add("show");
    clearTimeout(window.toastTimer);
    window.toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

/* =========================
   FIREBASE
========================= */
function toggleModal(show){
    document.getElementById("fb-modal").classList.toggle("show", show);
}

async function initFirebase(){
    const apiKey = document.getElementById("fb-api-key").value.trim();
    const databaseURL = document.getElementById("fb-db-url").value.trim().replace(/\/$/, "");
    if(!apiKey || !databaseURL){ showToast("API Key dan Database URL harus diisi"); return; }
    if(!/^https?:\/\//i.test(databaseURL)){ showToast("Database URL tidak valid"); return; }
    try{
        if(firebase.apps.length){ try{ await firebase.app().delete(); }catch(e){ console.warn(e); } }
        firebase.initializeApp({apiKey, databaseURL});
        dbRef = firebase.database().ref("robot_control");
        await dbRef.child("connection").set({connected:true,timestamp:Date.now()});
        localStorage.setItem("robotFirebaseApiKey",apiKey);
        localStorage.setItem("robotFirebaseDbUrl",databaseURL);
        finishFirebase();
    }catch(error){
        console.error("Firebase error:",error); dbRef=null; updateStatus(); showToast("Firebase gagal terhubung");
    }
}
function finishFirebase(){
    dbRef = firebase.database().ref("robot_control");
    updateStatus();
    toggleModal(false);
    showToast("🔥 Firebase terhubung");
}

function sendToFirebase(command, mode){
    if(!dbRef) return;

    dbRef.set({
        command:command,
        mode:mode,
        timestamp:Date.now()
    }).catch(console.error);
}

/* =========================
   BLUETOOTH MICRO:BIT
========================= */
async function connectBluetooth(){
    if(!navigator.bluetooth){
        showToast("Web Bluetooth tidak tersedia");
        return;
    }

    try{
        showToast("Mencari Micro:bit...");

        bluetoothDevice = await navigator.bluetooth.requestDevice({
            filters:[
                {namePrefix:"BBC micro:bit"},
                {namePrefix:"micro:bit"}
            ],
            optionalServices:[UART_SERVICE_UUID]
        });

        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService(UART_SERVICE_UUID);

        // Ambil kedua characteristic seperti di FIX_WEBSITE (yang berhasil kontrol)
        try {
            uartTxCharacteristic = await service.getCharacteristic(UART_TX_CHARACTERISTIC_UUID);
        } catch (e) { console.warn("UART TX Char (002) not found", e); uartTxCharacteristic = null; }

        try {
            uartRxCharacteristic = await service.getCharacteristic(UART_RX_CHARACTERISTIC_UUID);
        } catch (e) { console.warn("UART RX Char (003) not found", e); uartRxCharacteristic = null; }

        if(!uartTxCharacteristic && !uartRxCharacteristic){
            showToast("Characteristic UART tidak ditemukan");
            return;
        }

        updateStatus();
        showToast("🔵 Micro:bit terhubung");

        bluetoothDevice.addEventListener("gattserverdisconnected", () => {
            uartTxCharacteristic = null;
            uartRxCharacteristic = null;
            updateStatus();
            showToast("Micro:bit terputus");
        });

    }catch(error){
        console.error(error);
        showToast("Bluetooth dibatalkan/gagal");
    }
}

/* =========================
   KIRIM PERINTAH
========================= */
async function sendToMicrobit(command, force=false){
    if(currentCommand === command && !force) return;

    currentCommand = command;
    updateStatus();

    sendToFirebase(
        command,
        isAiMode ? "AI_AUTOMATIC" : "MANUAL_JOYSTICK"
    );

    // Logika sama seperti FIX_WEBSITE yang berhasil kontrol mobil
    const targetChar = uartRxCharacteristic || uartTxCharacteristic;
    if(targetChar){
        try{
            const encoder = new TextEncoder();

            // Format 1: structured seperti website yang bekerja
            const structuredPayload = `move,${command}\n`;
            await targetChar.writeValue(encoder.encode(structuredPayload));

            // Format 2: plain command
            const plainPayload = `${command}\n`;
            await targetChar.writeValue(encoder.encode(plainPayload));
        }catch(error){
            console.error("Bluetooth TX Error:", error);
        }
    }
}

/* =========================
   D-PAD
========================= */
const buttons = {
    "bt-up":"up",
    "bt-down":"down",
    "bt-left":"left",
    "bt-right":"right"
};

Object.entries(buttons).forEach(([id,command]) => {
    const button = document.getElementById(id);

    const start = e => {
        e.preventDefault();
        manualOverrideCommand = command;
        clearTimeout(manualOverrideTimer);
        sendToMicrobit(command, true);
    };

    const end = e => {
        e.preventDefault();
        manualOverrideCommand = null;
        clearTimeout(manualOverrideTimer);
        sendToMicrobit("stop",true);
    };

    button.addEventListener("mousedown",start);
    button.addEventListener("mouseup",end);
    button.addEventListener("mouseleave",end);

    button.addEventListener("touchstart",start,{passive:false});
    button.addEventListener("touchend",end,{passive:false});
});

/* =========================
   KEYBOARD
========================= */
const keyMap = {
    ArrowUp:"up",
    ArrowDown:"down",
    ArrowLeft:"left",
    ArrowRight:"right",
    w:"up",W:"up",
    s:"down",S:"down",
    a:"left",A:"left",
    d:"right",D:"right"
};

document.addEventListener("keydown",e => {
    if(!keyMap[e.key] || e.repeat) return;
    e.preventDefault();
    manualOverrideCommand = keyMap[e.key];
    sendToMicrobit(keyMap[e.key], true);
});

document.addEventListener("keyup",e => {
    if(!keyMap[e.key]) return;
    e.preventDefault();
    manualOverrideCommand = null;
    sendToMicrobit("stop",true);
});

/* =========================
   AI CAMERA
========================= */

async function toggleCamera(){
    const video = document.getElementById("camera-video");

    if(!isAiMode){
        try{
            showToast("Memuat kamera...");

            if(!model){
                model = await tmImage.load(
                    MODEL_URL + "model.json",
                    MODEL_URL + "metadata.json"
                );
                maxPredictions = model.getTotalClasses();
            }

            const stream = await navigator.mediaDevices.getUserMedia({
                video:{
                    facingMode:"user",
                    width:{ideal:1280},
                    height:{ideal:720}
                },
                audio:false
            });

            video.srcObject = stream;
            video.style.transform = "scaleX(1)";
            video.style.webkitTransform = "scaleX(1)";
            video.style.display = "block";
            await video.play();

            // Hanya setelah kamera benar-benar hidup:
            isAiMode = true;
            setCameraButton(true);
            updateStatus();
            showToast("📷 Kamera ON");

            startAIHeartbeat();
            requestAnimationFrame(loop);

        }catch(error){
            console.error("Camera error:", error);
            isAiMode = false;
            stopAIHeartbeat();
            setCameraButton(false);
            updateStatus();
            video.style.display = "none";
            video.srcObject = null;
            showToast("Kamera gagal dibuka");
        }

    }else{
        isAiMode = false;
        stopAIHeartbeat();

        if(video.srcObject){
            video.srcObject.getTracks().forEach(track => track.stop());
        }

        video.pause();
        video.srcObject = null;
        video.style.display = "none";

        setCameraButton(false);
        updateStatus();
        const nameEl = document.getElementById("gesture-name");
        const percentEl = document.getElementById("gesture-percent");
        const fillEl = document.getElementById("gesture-bar-fill");
        if(nameEl) nameEl.textContent = "Belum ada tangan";
        if(percentEl) percentEl.textContent = "0%";
        if(fillEl) fillEl.style.width = "0%";
        await sendToMicrobit("stop",true);
        showToast("📷 Kamera OFF");
    }
}

async function loop(){
    if(!isAiMode) return;

    const video = document.getElementById("camera-video");

    if(video.readyState >= 2 && !predictionBusy){
        predictionBusy = true;
        try{
            await predict();
        }catch(error){
            console.error("Prediction error:", error);
        }finally{
            predictionBusy = false;
        }
    }

    if(isAiMode) requestAnimationFrame(loop);
}

async function predict(){
    const video = document.getElementById("camera-video");

    if(!model || !isAiMode || video.readyState < 2) return;

    const prediction = await model.predict(video);

    let highest = 0;
    let best = "stop";

    for(let i=0;i<maxPredictions;i++){
        if(prediction[i].probability > highest){
            highest = prediction[i].probability;
            best = prediction[i].className.toLowerCase().trim();
        }
    }

    // Tampilkan hasil + persen seperti contoh web gesture.
    const percent = Math.round(highest * 100);
    const nameEl = document.getElementById("gesture-name");
    const percentEl = document.getElementById("gesture-percent");
    const fillEl = document.getElementById("gesture-bar-fill");
    const listEl = document.getElementById("gesture-list");
    if(nameEl) nameEl.textContent = best === "stop" ? "Tidak terdeteksi" : best;
    if(percentEl) percentEl.textContent = percent + "%";
    if(fillEl) fillEl.style.width = percent + "%";
    if(listEl){
        listEl.innerHTML = prediction
            .slice()
            .sort((a,b)=>b.probability-a.probability)
            .map(p => `<span>${p.className}: ${Math.round(p.probability*100)}%</span>`)
            .join("");
    }

    // 5 jari/open palm = MAJU, kepal = MUNDUR,
    // 2 jari/peace = KANAN, jempol = KIRI.
    let command = "stop";
    if(highest >= 0.60){
        const five = best.includes("5") || best.includes("lima") || best.includes("open") || best.includes("palm") || best.includes("maju") || best.includes("atas") || best.includes("up");
        const fist = best.includes("fist") || best.includes("kepal") || best.includes("0") || best.includes("mundur") || best.includes("bawah") || best.includes("down");
        const two = best.includes("2") || best.includes("dua") || best.includes("peace") || best.includes("kanan") || best.includes("right");
        const thumb = best.includes("jempol") || best.includes("thumb") || best.includes("thumbs") || best.includes("kiri") || best.includes("left");
        if(five) command = "up";
        else if(fist) command = "down";
        else if(two) command = "right";
        else if(thumb) command = "left";
    }

    // Kalau panah/keyboard sedang ditekan, kontrol manual punya prioritas.
    if(!manualOverrideCommand){
        await sendToMicrobit(command, command !== currentCommand);
    }
}

// Kirim ulang perintah AI secara berkala supaya motor tetap mendapat
// perintah maju/mundur/kiri/kanan meskipun satu paket BLE terlewat.
function startAIHeartbeat(){
    clearInterval(aiHeartbeatTimer);
    aiHeartbeatTimer = setInterval(async () => {
        const targetChar = uartRxCharacteristic || uartTxCharacteristic;
        if(!isAiMode || !targetChar || currentCommand === "stop") return;
        try{
            const encoder = new TextEncoder();
            // Kirim dual format seperti sendToMicrobit agar firmware tetap menerima
            await targetChar.writeValue(encoder.encode(`move,${currentCommand}\n`));
            await targetChar.writeValue(encoder.encode(`${currentCommand}\n`));
        }catch(error){
            console.error("AI heartbeat BLE Error:", error);
        }
    }, 250);
}

function stopAIHeartbeat(){
    clearInterval(aiHeartbeatTimer);
    aiHeartbeatTimer = null;
}
